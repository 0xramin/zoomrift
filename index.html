<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zoomrift — Infinite Zoom</title>
  <link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="zoom-canvas" aria-label="Zoomrift WebGL infinite zoom canvas"></canvas>

    <div class="loader" id="loader" aria-live="polite">
      <div class="loader-spinner"></div>
      <span class="loader-text" id="loader-text">Loading artwork…</span>
    </div>

    <div class="hud" id="hud">
      <header class="hud-top">
        <div class="artwork-badge">
          <button type="button" class="icon-btn" id="btn-prev" title="Previous artwork (Left Arrow)" aria-label="Previous artwork">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="artwork-meta">
            <h1 class="artwork-title" id="artwork-title">The Zoomquilt</h1>
            <p class="artwork-author" id="artwork-author"></p>
          </div>
          <button type="button" class="icon-btn" id="btn-next" title="Next artwork (Right Arrow)" aria-label="Next artwork">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <div class="top-actions">
          <button type="button" class="icon-btn lang-btn" id="btn-lang" title="Switch language (L)" aria-label="Switch language">FA</button>
          <button type="button" class="icon-btn" id="btn-random" title="Random artwork & FX (R)" aria-label="Randomize">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-adjust-toggle" title="Color & center adjustments" aria-label="Adjustments" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-fullscreen" title="Fullscreen (F)" aria-label="Toggle fullscreen">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-hide-hud" title="Hide controls (H or tap canvas)" aria-label="Hide controls">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </header>

      <aside class="adjust-popover" id="adjust-popover" hidden>
        <div class="popover-row">
          <label for="rng-brightness"><span id="lbl-brightness">Brightness</span> <span id="val-brightness" class="num-ltr">0</span></label>
          <input id="rng-brightness" type="range" min="-50" max="50" step="1" value="0" />
        </div>
        <div class="popover-row">
          <label for="rng-contrast"><span id="lbl-contrast">Contrast</span> <span id="val-contrast" class="num-ltr">0</span></label>
          <input id="rng-contrast" type="range" min="-50" max="50" step="1" value="0" />
        </div>
        <div class="popover-row">
          <label for="rng-saturation"><span id="lbl-saturation">Saturation</span> <span id="val-saturation" class="num-ltr">0</span></label>
          <input id="rng-saturation" type="range" min="-50" max="50" step="1" value="0" />
        </div>
        <div class="popover-toggle">
          <label class="checkbox-label">
            <input id="chk-random-center" type="checkbox" />
            <span id="lbl-random-center">Random Center Offset</span>
          </label>
          <button type="button" class="pill-btn" id="btn-reset-adjust">Reset</button>
        </div>
        <p class="popover-hint" id="lbl-hint">Drag vertically on canvas to control zoom speed, or tap to toggle UI.</p>
      </aside>

      <section class="hud-bottom" aria-label="Wallpaper controls">
        <div class="control-row">
          <button type="button" class="icon-btn" id="btn-play-pause" title="Play / Pause (Space)" aria-label="Pause">
            <svg id="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
            <svg id="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" hidden><polygon points="6 4 20 12 6 20 6 4"/></svg>
          </button>

          <div class="speed-control">
            <span class="speed-label" id="lbl-speed">Speed</span>
            <input id="rng-speed" type="range" min="-3.5" max="3.5" step="0.05" value="1.1" aria-label="Zoom speed" />
            <span class="speed-val num-ltr" id="val-speed">+1.10</span>
          </div>

          <button type="button" class="pill-btn" id="btn-reverse" title="Reverse zoom direction">Reverse</button>
        </div>

        <div class="pill-strip" id="fx-strip" role="group" aria-label="Shader effects">
          <button type="button" class="pill-btn active" data-fx="original">Original</button>
          <button type="button" class="pill-btn" data-fx="hue">Hue</button>
          <button type="button" class="pill-btn" data-fx="flare">Fade</button>
          <button type="button" class="pill-btn" data-fx="prism">Prism</button>
          <button type="button" class="pill-btn" data-fx="swirl">Swirl</button>
          <button type="button" class="pill-btn" data-fx="acid">Acid</button>
        </div>

        <div class="pill-strip" id="artwork-strip" role="group" aria-label="Artworks"></div>
      </section>
    </div>

    <div class="error-banner" id="error-banner" hidden></div>
  </main>

  <script defer src="js/quilts.js"></script>
  <script defer src="js/shaders.js"></script>
  <script defer src="js/zoom-engine.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
